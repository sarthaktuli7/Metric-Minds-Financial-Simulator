<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOTTE CDMO Strategy Simulator – Team Metric Minds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
:root{--navy:#13233E;--navy2:#1c3358;--bg:#f5f7fa;--card:#ffffff;--ink:#13233E;--mute:#5b6b82;--line:#dde3ec;--red:#E31B45;--tint:#fdebef;--rose:#D9776E;--gray:#8c97a8;--good:#16794a;--bad:#E31B45;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13233E;--ink:#eef2f8;--mute:#9FB3C8;--line:#264066;--red:#ff4f70;--tint:#3a1a2a;--rose:#e58a82;--gray:#7f8ea6;--good:#4cc38a;--bad:#ff6b85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13233E;--ink:#eef2f8;--mute:#9FB3C8;--line:#264066;--red:#ff4f70;--tint:#3a1a2a;--rose:#e58a82;--gray:#7f8ea6;--good:#4cc38a;--bad:#ff6b85;color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Century Gothic",CenturyGothic,AppleGothic,Questrial,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.3}
.hero{flex:none;background:var(--navy);color:#fff;border-bottom:3px solid var(--red)}
.hero .in{padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero svg.logo{height:104px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:14px}
.mk{height:36px;width:36px;flex:none;display:block}
.bt small{display:block;font-size:10px;letter-spacing:.4em;color:#9FB3C8;margin-bottom:2px}
.bt b{display:block;font-size:clamp(18px,2.1vw,28px);line-height:1;letter-spacing:.03em;font-weight:700;white-space:nowrap}
.bt em{font-style:normal;color:#ff4f70}
.tg{display:flex;align-items:center;gap:12px}
.lg{font-size:clamp(18px,2.1vw,28px);font-weight:700;letter-spacing:.14em;line-height:1}
.ttl{font-size:clamp(14px,1.6vw,21px);letter-spacing:.03em;white-space:nowrap}
.lotte{font-size:clamp(18px,2vw,26px);font-weight:700;letter-spacing:.12em;text-align:right;line-height:1.1}
.lotte span{display:block;font-size:10px;letter-spacing:.4em;color:#9FB3C8;font-weight:400}
.hero .t{text-align:right}
.hero .t b{display:block;font-size:18px}
.hero .t span{font-size:12px;color:#9FB3C8}
.scen{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.scen .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-right:2px}
button.p{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button.p.on{background:var(--red);border-color:var(--red);color:#fff}
.main{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 320px;gap:10px;padding:10px 14px 12px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0}
.card h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:400}
.fill{flex:1;display:flex;flex-direction:column}
.top{flex:none;display:grid;grid-template-columns:210px 1fr;gap:10px}
.big{background:var(--tint);border:2px solid var(--red);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
.big .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.big .v{white-space:nowrap;font-size:36px;line-height:1.05;color:var(--red);margin:3px 0;font-variant-numeric:tabular-nums}
.big .d{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:8px;padding:5px 9px;min-width:0}
.tile .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .d{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--good)}.down{color:var(--bad)}
.chartbox{flex:1;min-height:0;position:relative}
.chartbox svg{position:absolute;inset:0}
svg text{fill:var(--mute);font-size:13px;font-family:inherit}
.tabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:6px 4px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.ctl{margin-bottom:15px}
.ctl label{display:flex;justify-content:space-between;gap:6px;font-size:14px;margin-bottom:3px}
.ctl label b{font-weight:400;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;margin:0;accent-color:var(--red)}
.stackbar{display:flex;height:38px;border-radius:7px;overflow:hidden;background:var(--line)}
.stackbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;white-space:nowrap;min-width:0}
.legend{margin-top:8px;font-size:13px}
.legend .r{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:3px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.bars{flex:1;min-height:0;display:flex;gap:8px;padding-top:2px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.bars .b b{font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.bars .b .tr{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end}
.bars .b i{display:block;width:100%;border-radius:5px 5px 0 0}
.bars .b span{font-size:14px;color:var(--mute);margin-top:3px}
.note{font-size:11.5px;color:var(--mute);margin:6px 0 0;line-height:1.3}
@media (max-width:980px),(max-height:600px){
 body{height:auto;overflow:auto}
 .main{grid-template-columns:1fr;flex:none}
 .chartbox{height:260px;flex:none}
 .bars{height:170px;flex:none}
 .top{grid-template-columns:1fr}
 .bt b{font-size:26px}
}
</style>
</head>
<body>
<div class="hero"><div class="in">
 <div class="brand">
  <svg class="mk" viewBox="0 0 120 120" role="img" aria-label="Team Metric Minds mark">
   <rect x="0" y="0" width="120" height="120" rx="28" fill="#E31B45"/>
   <polyline points="26,90 26,34 60,68 94,34 94,90" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="26" cy="34" r="9" fill="#fff"/><circle cx="60" cy="68" r="9" fill="#fff"/><circle cx="94" cy="34" r="9" fill="#fff"/>
   <circle cx="26" cy="34" r="3.6" fill="#E31B45"/><circle cx="60" cy="68" r="3.6" fill="#E31B45"/><circle cx="94" cy="34" r="3.6" fill="#E31B45"/>
  </svg>
  <div class="bt"><small>TEAM</small><b>METRIC <em>MINDS</em></b></div>
 </div>
 <div class="tg"><div class="lg" id="lottelogo">LOTTE</div><div class="ttl">Biologics Strategy Simulator</div></div>
</div></div>
<div class="scen"><span class="lab">Scenario</span><span id="presets" style="display:contents"></span></div>

<div class="main">
 <div class="col"><div class="card fill"><h2>Levers</h2><div class="tabs" id="tabs"></div><div id="ctls"></div></div></div>

 <div class="col">
  <div class="top"><div class="big" id="big"></div><div class="tiles" id="tiles"></div></div>
  <div class="card fill"><h2>Profit passes spend in month <span id="paym"></span> ($M, cumulative)</h2><div class="chartbox" id="chartbox"><svg id="chart" role="img" aria-label="Cumulative gross profit versus program spend by month"></svg></div></div>
 </div>

 <div class="col">
  <div class="card"><h2>Run-rate at month 18, by customer type</h2><div class="stackbar" id="stack"></div><div class="legend" id="legend"></div></div>
  <div class="card fill"><h2>Payback month by win rate</h2><div class="bars" id="bars"></div><p class="note">One win rate for all customer types. Our team’s assumptions, not LOTTE’s forecasts.</p></div>
 </div>
</div>

<script>
var BASE={pc:20,po:15,pa:5,wc:20,wo:20,wa:20,coreVal:15,optVal:6,ancVal:20,margin:35,spend:5.17,lag:3,delay:0,ancDelay:0,fail:0,fund:0};
var S=JSON.parse(JSON.stringify(BASE));
var TABS=[
 ["Customers",[["pc","Core proposals sent",0,40,1,""],["po","Option-bet proposals sent",0,40,1,""],["pa","Anchor proposals sent",0,20,1,""],["wc","Core win rate",0,40,1,"%"],["wo","Option win rate",0,40,1,"%"],["wa","Anchor win rate",0,40,1,"%"]]],
 ["Economics",[["coreVal","Core contract, 30 months",5,30,1,"M"],["optVal","Option contract, 18 months",2,15,0.5,"M"],["ancVal","Anchor, per year for 5 years",5,40,1,"M"],["margin","Gross margin",15,50,1,"%"],["spend","Program spend",3,9,0.1,"M"],["lag","Signing to revenue",1,9,1,"mo"]]],
 ["Risk",[["delay","All signings late",0,9,1,"mo"],["ancDelay","Songdo gate slips (anchor)",0,12,1,"mo"],["fail","Clinical failures cut revenue",0,50,5,"%"],["fund","Funding squeeze cuts biotech wins",0,60,5,"%"]]]
];
var tab=0;
var PRE=[["Base case",{}],["Half win rate",{wc:10,wo:10,wa:10}],["5% win rate",{wc:5,wo:5,wa:5}],["3-month delay",{delay:3,ancDelay:3}],["Funding drops",{fund:50}],["Songdo slips 6 mo",{ancDelay:6}],["Margin 25%",{margin:25}],["Pilots fully funded",{spend:6.17}],["No anchor deal",{pa:0}]];
function fmt(v,d){return v.toFixed(d===undefined?1:d)}
function run(p){
 var seg=[
  {n:"Core",c:"var(--red)",base:[6,9,12,15],bn:4,val:p.coreVal,dur:30,lag:p.lag,fail:p.fail/100,ex:p.delay,wins:p.pc*p.wc/100*(1-p.fund/100)},
  {n:"Option",c:"var(--rose)",base:[7,11,14],bn:3,val:p.optVal*0.92,dur:18,lag:p.lag,fail:p.fail/100,ex:p.delay,wins:p.po*p.wo/100*(1-p.fund/100)},
  {n:"Anchor",c:"var(--gray)",base:[12],bn:1,val:p.ancVal*5,dur:60,lag:p.lag+3,fail:0,ex:p.delay+p.ancDelay,wins:p.pa*p.wa/100}
 ];
 var M=36,rev=[],m,i;for(i=0;i<=M;i++)rev.push(0);var book=0;
 seg.forEach(function(s){var sc=s.wins/s.bn*(1-s.fail),mo=s.val/s.dur;s.book=s.wins*s.val;book+=s.book;s.rev18=0;s.m18=0;
  s.base.forEach(function(sm){var st=sm+s.ex+s.lag;for(m=st;m<=M&&m<st+s.dur;m++){rev[m]+=mo*sc;if(m<=18)s.rev18+=mo*sc;if(m===18)s.m18+=mo*sc;}});});
 var pts=[0,.0387,.2514,.4449,.6576,.8511,1];
 function spend(mm){if(mm>=18)return p.spend;var k=Math.floor(mm/3),f=(mm%3)/3;return p.spend*(pts[k]+(pts[Math.min(k+1,6)]-pts[k])*f);}
 var cum=0,pay=null,gp=[],sp=[];
 for(m=0;m<=M;m++){cum+=rev[m]*p.margin/100;gp.push(cum);sp.push(spend(m));if(pay===null&&m>0&&cum>0&&cum>=spend(m))pay=m;}
 var r18=0;for(m=0;m<=18;m++)r18+=rev[m];
 return {pay:pay,book:book,rev18:r18,rr:rev[18]*12,net18:gp[18]-sp[18],ret:gp[18]/p.spend,gp:gp,sp:sp,seg:seg,progs:seg[0].wins+seg[1].wins+seg[2].wins};
}
var baseRes=run(BASE);
function dl(cur,b,pre,suf,dec){var x=cur-b;if(Math.abs(x)<0.05)return "same as base";return '<span class="'+(x>0?'up':'down')+'">'+(x>0?"+":"−")+pre+fmt(Math.abs(x),dec)+suf+'</span> vs base';}
function tile(l,v,d){return '<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>';}
function drawCtl(){
 var h="";TABS[tab][1].forEach(function(c){h+='<div class="ctl"><label><span>'+c[1]+'</span><b id="v_'+c[0]+'"></b></label><input type="range" data-k="'+c[0]+'" min="'+c[2]+'" max="'+c[3]+'" step="'+c[4]+'" value="'+S[c[0]]+'"></div>';});
 var el=document.getElementById("ctls");el.innerHTML=h;
 var ins=el.querySelectorAll("input");
 for(var i=0;i<ins.length;i++)ins[i].addEventListener("input",function(e){S[e.target.getAttribute("data-k")]=parseFloat(e.target.value);setOn(-1);draw();});
 labels();
}
function labels(){TABS[tab][1].forEach(function(c){var v=S[c[0]],e=document.getElementById("v_"+c[0]);if(!e)return;var t;
 if(c[5]==="M")t="$"+(c[0]==="spend"?fmt(v,2):fmt(v,v%1?1:0))+"M";else if(c[5]==="mo")t=v+" mo";else if(c[5]==="%")t=v+"%";else t=String(v);e.textContent=t;});}
function setOn(i){var b=document.querySelectorAll("button.p");for(var k=0;k<b.length;k++)b[k].classList.toggle("on",k===i);}
function draw(){
 labels();
 var r=run(S);
 var pt=r.pay===null?"> 36":String(r.pay);
 var pd=r.pay===null?"No payback in 36 months":(r.pay===baseRes.pay?"Same as base case":(r.pay>baseRes.pay?'<span class="down">'+(r.pay-baseRes.pay)+' mo later</span> than base':'<span class="up">'+(baseRes.pay-r.pay)+' mo earlier</span> than base'));
 document.getElementById("paym").textContent=pt;
 document.getElementById("big").innerHTML='<div class="l">Payback</div><div class="v">'+(r.pay===null?"> 36":"Month "+r.pay)+'</div><div class="d">'+pd+'<br>$1 returns $'+fmt(r.ret,2)+' by M18</div>';
 document.getElementById("tiles").innerHTML=
  tile("Programs",fmt(r.progs,1),"base "+fmt(baseRes.progs,1))+
  tile("Contract","$"+fmt(r.book,0)+"M",dl(r.book,baseRes.book,"$","M",0))+
  tile("Revenue 18m","$"+fmt(r.rev18)+"M",dl(r.rev18,baseRes.rev18,"$","M",1))+
  tile("Run-rate M18","$"+fmt(r.rr)+"M",dl(r.rr,baseRes.rr,"$","M",1))+
  tile("Profit−spend",(r.net18<0?"−":"+")+"$"+fmt(Math.abs(r.net18))+"M",dl(r.net18,baseRes.net18,"$","M",1))+
  tile("Spend","$"+fmt(S.spend,2)+"M","gross margin "+S.margin+"%");
 // chart sized to its box
 var box=document.getElementById("chartbox"),svg=document.getElementById("chart");
 var W=Math.max(300,box.clientWidth),H=Math.max(160,box.clientHeight),L=38,R=10,T=6,B=24,N=30;
 svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("width",W);svg.setAttribute("height",H);
 var mx=Math.max(8,Math.ceil(Math.max(r.gp[N],r.sp[N],baseRes.gp[N])/4)*4);
 function X(q){return L+(W-L-R)*q/N}function Y(v){return H-B-(H-T-B)*v/mx}
 function path(a){var s="",k;for(k=0;k<=N;k++)s+=(k?"L":"M")+X(k).toFixed(1)+" "+Y(a[k]).toFixed(1);return s;}
 var g="",k;
 for(k=0;k<=mx;k+=mx/4)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(k)+'" y2="'+Y(k)+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(Y(k)+4)+'" text-anchor="end">'+fmt(k,0)+'</text>';
 for(k=0;k<=N;k+=6)g+='<text x="'+X(k)+'" y="'+(H-5)+'" text-anchor="'+(k===N?'end':'middle')+'">M'+k+'</text>';
 g+='<path d="'+path(baseRes.gp)+'" fill="none" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="4 4"/>';
 g+='<path d="'+path(r.sp)+'" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
 g+='<path d="'+path(r.gp)+'" fill="none" stroke="var(--red)" stroke-width="2.8"/>';
 if(r.pay!==null&&r.pay<=N)g+='<circle cx="'+X(r.pay)+'" cy="'+Y(r.gp[r.pay])+'" r="5" fill="var(--red)"/><text x="'+X(r.pay)+'" y="'+(Y(r.gp[r.pay])-10)+'" text-anchor="middle" style="fill:var(--red);font-size:15px">Month '+r.pay+'</text>';
 g+='<rect x="'+(L+8)+'" y="'+(T+6)+'" width="11" height="3" fill="var(--red)"/><text x="'+(L+25)+'" y="'+(T+11)+'">Gross profit</text><rect x="'+(L+140)+'" y="'+(T+6)+'" width="11" height="3" fill="var(--ink)"/><text x="'+(L+157)+'" y="'+(T+11)+'">Spend</text><rect x="'+(L+225)+'" y="'+(T+6)+'" width="11" height="3" fill="var(--gray)"/><text x="'+(L+242)+'" y="'+(T+11)+'">Base case profit</text>';
 svg.innerHTML=g;
 var tot=0;r.seg.forEach(function(s){s.rr=s.m18*12;tot+=s.rr;});
 var sb="",lg="";
 r.seg.forEach(function(s){var w=tot>0?s.rr/tot*100:0;sb+='<div style="width:'+w+'%;background:'+s.c+'">'+(w>18?"$"+fmt(s.rr,0)+"M":"")+'</div>';
  lg+='<div class="r"><span><i style="background:'+s.c+'"></i>'+s.n+' · '+fmt(s.wins,1)+' prog.</span><span>$'+fmt(s.rr,1)+'M</span></div>';});
 lg+='<div class="r"><b style="font-weight:400">Total run-rate</b><span>$'+fmt(tot,1)+'M</span></div>';
 document.getElementById("stack").innerHTML=sb;document.getElementById("legend").innerHTML=lg;
 var rates=[20,15,10,7.5,5],cols=["var(--red)","#e9808f","var(--rose)","#c9a5a8","var(--gray)"],bh="";
 rates.forEach(function(w,i){var q=JSON.parse(JSON.stringify(S));q.wc=q.wo=q.wa=w;var x=run(q);var v=x.pay===null?36:x.pay;
  bh+='<div class="b"><b>'+(x.pay===null?"> 36":x.pay)+'</b><div class="tr"><i style="height:'+Math.max(3,v/36*100)+'%;background:'+cols[i]+'"></i></div><span>'+w+'%</span></div>';});
 document.getElementById("bars").innerHTML=bh;
}
var tb=document.getElementById("tabs");
TABS.forEach(function(t,i){var b=document.createElement("button");b.textContent=t[0];b.className=i===0?"on":"";b.onclick=function(){tab=i;var bs=tb.querySelectorAll("button");for(var k=0;k<bs.length;k++)bs[k].classList.toggle("on",k===i);drawCtl();};tb.appendChild(b);});
var pb=document.getElementById("presets");
PRE.forEach(function(p,i){var b=document.createElement("button");b.className="p"+(i===0?" on":"");b.textContent=p[0];
 b.onclick=function(){S=JSON.parse(JSON.stringify(BASE));for(var k in p[1])S[k]=p[1][k];setOn(i);drawCtl();draw();};pb.appendChild(b);});
window.addEventListener("resize",draw);
drawCtl();draw();
</script>
</body>
</html>
